name: production-verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urai-jobs-production-verification-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      URAI_ENV: prod
      FIREBASE_PROJECT_ID: urai-jobs
      GCLOUD_PROJECT: urai-jobs
      GOOGLE_CLOUD_PROJECT: urai-jobs
      GCP_REGION: us-central1
      GCS_BUCKET_NAME: urai-jobs-artifacts
      API_ALLOWED_ORIGINS: https://urai.app,https://admin.urai.app,https://analytics.urai.app
      WEBHOOK_SIGNING_SECRET: ${{ github.event_name == 'workflow_dispatch' && secrets.WEBHOOK_SIGNING_SECRET || 'ci-placeholder-webhook-signing-secret' }}
      NARRATOR_WORKER_URL: https://narrator-worker-wkyojbnbiq-uc.a.run.app
      ASSET_WORKER_URL: https://asset-worker-wkyojbnbiq-uc.a.run.app
      SPATIAL_WORKER_URL: https://spatial-worker-wkyojbnbiq-uc.a.run.app
      STUDIO_WORKER_URL: https://studio-worker-wkyojbnbiq-uc.a.run.app
      FIREBASE_HOSTING_SITE: urai-jobs-563121397472

    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
        with:
          version: 8.15.9

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile

      - name: Prove install preserved exact source
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"

      - name: Workspace verification
        run: pnpm check:workspace

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Runtime verification
        run: pnpm urai-jobs:verify

      - name: Smoke verification
        run: pnpm urai-jobs:smoke

      - name: Deploy precheck
        run: pnpm urai-jobs:deploy-precheck

      - name: Production env precheck
        if: github.event_name == 'workflow_dispatch'
        run: pnpm prod:precheck

      - name: PR production secret gate note
        if: github.event_name == 'pull_request'
        run: |
          echo "Production env precheck is intentionally skipped on pull_request because production secrets are unavailable to PRs."
          echo "Run this workflow manually after merge to validate real production secrets."

      - name: Prove final clean tree
        if: always()
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"
