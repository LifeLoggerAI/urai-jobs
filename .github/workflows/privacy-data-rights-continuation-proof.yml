name: Privacy Data Rights Continuation Proof

on:
  pull_request:
    branches:
      - fix/private-consent-cleanup-continuation-20261007
      - repair/life-movie-convergence-20261007
      - main
    paths:
      - functions/src/privacy/dataRightsExecution.ts
      - functions/src/privacy/privateLifeModelDataRights.ts
      - scripts/privacy-data-rights-execution-authority.test.mjs
      - functions/src/privacy/dataRightsContinuationPolicy.ts
      - scripts/privacy-data-rights-continuation-policy.test.mjs
      - scripts/privacy-data-rights-execution-contract.mjs
      - scripts/private-life-model-rights-recovery.test.mjs
      - package.json
      - .github/workflows/privacy-data-rights-continuation-proof.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack prepare pnpm@8.15.9 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node --test scripts/privacy-data-rights-continuation-policy.test.mjs
      - run: node scripts/privacy-data-rights-execution-contract.mjs
      - run: node --test scripts/private-life-model-rights-recovery.test.mjs
      - run: node scripts/privacy-data-rights-execution-authority.test.mjs
      - run: pnpm --dir functions typecheck

