name: URAI Jobs Canonical Production Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - prod
      confirm_launch_unlock:
        description: Type DEPLOY-URAI-JOBS-STAGING or DEPLOY-URAI-JOBS-PRODUCTION
        required: true
        type: string
      expected_sha:
        description: Exact repository SHA to deploy
        required: true
        type: string
      rollback_sha:
        description: Approved ancestor rollback repository SHA
        required: true
        type: string
      rollback_config_fingerprints_json:
        description: Exact approved rollback configuration fingerprint for narrator-worker and asset-worker
        required: true
        type: string
      target_secret_versions_json:
        description: Exact numeric target versions for URAI_JOBS_WORKER_TOKEN, URAI_WHEEL_GITHUB_TOKEN, and URAI_JOBS_CALLBACK_SECRET
        required: true
        type: string
      require_custom_domains:
        description: Require custom-domain checks in addition to Firebase Hosting URLs
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: urai-jobs-canonical-deploy-${{ inputs.target }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '8.15.9'

jobs:
  preflight:
    name: Verify exact candidate without cloud authority
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      INPUT_TARGET: ${{ inputs.target }}
      INPUT_CONFIRMATION: ${{ inputs.confirm_launch_unlock }}
      INPUT_EXPECTED_SHA: ${{ inputs.expected_sha }}
      INPUT_ROLLBACK_SHA: ${{ inputs.rollback_sha }}
      INPUT_ROLLBACK_FINGERPRINTS: ${{ inputs.rollback_config_fingerprints_json }}
      INPUT_TARGET_SECRET_VERSIONS: ${{ inputs.target_secret_versions_json }}
    steps:
      - name: Checkout exact candidate with rollback history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact inputs and clean source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$INPUT_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INPUT_ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$INPUT_TARGET" in
            staging) EXPECTED_CONFIRMATION='DEPLOY-URAI-JOBS-STAGING' ;;
            prod) EXPECTED_CONFIRMATION='DEPLOY-URAI-JOBS-PRODUCTION' ;;
            *) echo 'Unsupported deployment target' >&2; exit 64 ;;
          esac
          test "$INPUT_CONFIRMATION" = "$EXPECTED_CONFIRMATION"
          test "$(git rev-parse HEAD)" = "$INPUT_EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$INPUT_EXPECTED_SHA" != "$INPUT_ROLLBACK_SHA"
          git cat-file -e "$INPUT_ROLLBACK_SHA^{commit}"
          git merge-base --is-ancestor "$INPUT_ROLLBACK_SHA" "$INPUT_EXPECTED_SHA"
          node - <<'NODE'
          function exactObject(raw, required, label, valuePattern) {
            const value = JSON.parse(raw);
            if (!value || Array.isArray(value) || typeof value !== 'object') throw new Error(`${label} must be an object`);
            const keys = Object.keys(value).sort();
            if (JSON.stringify(keys) !== JSON.stringify([...required].sort())) throw new Error(`${label} keys must equal ${required.join(', ')}`);
            for (const [key, item] of Object.entries(value)) {
              if (!valuePattern.test(String(item))) throw new Error(`${label}.${key} is invalid`);
            }
          }
          exactObject(process.env.INPUT_ROLLBACK_FINGERPRINTS, ['asset-worker', 'narrator-worker'], 'rollback fingerprints', /^[0-9a-f]{64}$/);
          exactObject(process.env.INPUT_TARGET_SECRET_VERSIONS, ['URAI_JOBS_CALLBACK_SECRET', 'URAI_JOBS_WORKER_TOKEN', 'URAI_WHEEL_GITHUB_TOKEN'], 'target secret versions', /^[1-9][0-9]*$/);
          NODE

      - name: Setup Node
        uses: actions/setup-node@1e60f620b9541d80c77f7b4a3bcd8bf5e940c37 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable exact pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(pnpm --version)" = "$PNPM_VERSION"

      - name: Frozen dependency installation
        run: pnpm install --frozen-lockfile

      - name: Repository verification gates
        run: |
          pnpm activation:verify
          pnpm urai-jobs:verify
          pnpm urai-jobs:smoke
          pnpm typecheck
          pnpm build
          pnpm test
          pnpm urai-jobs:deploy-precheck

      - name: Write credential-free preflight receipt
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p docs/release-evidence
          node - <<'NODE'
          const fs = require('fs');
          const receipt = {
            schemaVersion: 'urai-jobs-canonical-preflight-1',
            repository: process.env.GITHUB_REPOSITORY,
            workflowRunId: process.env.GITHUB_RUN_ID,
            targetSha: process.env.INPUT_EXPECTED_SHA,
            rollbackSha: process.env.INPUT_ROLLBACK_SHA,
            environment: process.env.INPUT_TARGET,
            status: process.env.JOB_STATUS,
            cloudAuthenticated: false,
            deploymentPerformed: false,
            paidProviderCalls: 0,
          };
          fs.writeFileSync('docs/release-evidence/canonical-preflight.json', `${JSON.stringify(receipt, null, 2)}\n`);
          NODE

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: urai-jobs-preflight-${{ inputs.target }}-${{ inputs.expected_sha }}
          path: docs/release-evidence/canonical-preflight.json
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: Protected worker and Firebase mutation
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: ${{ inputs.target }}
    permissions:
      contents: read
      id-token: write
    env:
      INPUT_TARGET: ${{ inputs.target }}
      TARGET_SHA: ${{ inputs.expected_sha }}
      ROLLBACK_SHA: ${{ inputs.rollback_sha }}
      DEPLOY_ROLLBACK_CONFIG_FINGERPRINTS_JSON: ${{ inputs.rollback_config_fingerprints_json }}
      DEPLOY_TARGET_SECRET_VERSIONS_JSON: ${{ inputs.target_secret_versions_json }}
      FIREBASE_CLI_VERSION: ${{ vars.FIREBASE_CLI_VERSION }}
      GCLOUD_CLI_VERSION: ${{ vars.GCLOUD_CLI_VERSION }}
      URAI_JOBS_WORKER_TOKEN_SECRET: URAI_JOBS_WORKER_TOKEN
      URAI_WHEEL_GITHUB_TOKEN_SECRET: urai-wheel-github-token
      URAI_JOBS_CALLBACK_SECRET_NAME: urai-jobs-callback-secret
    steps:
      - name: Checkout exact candidate with rollback history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact clean mutation source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git merge-base --is-ancestor "$ROLLBACK_SHA" "$TARGET_SHA"

      - name: Setup Node
        uses: actions/setup-node@1e60f620b9541d80c77f7b4a3bcd8bf5e940c37 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Enable exact pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(pnpm --version)" = "$PNPM_VERSION"

      - name: Install exact candidate dependencies before cloud authentication
        run: pnpm install --frozen-lockfile

      - name: Revalidate deployment source contracts before cloud authentication
        run: pnpm security:worker-deploy

      - name: Build and hash Firebase deployable bytes before cloud authentication
        env:
          DEPLOY_SOURCE_SHA: ${{ env.TARGET_SHA }}
        run: |
          pnpm prod:precheck
          pnpm --filter @urai-jobs/shared-types build
          pnpm --filter urai-jobs-functions build
          pnpm --filter urai-jobs-web build
          node scripts/firebase-prebuilt-manifest.mjs --write
          node scripts/firebase-prebuilt-manifest.mjs --verify

      - name: Install exact Firebase CLI before cloud authentication
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FIREBASE_CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          mkdir -p docs/release-evidence
          npm view "firebase-tools@$FIREBASE_CLI_VERSION" dist.integrity --json > docs/release-evidence/firebase-cli-integrity.json
          test -s docs/release-evidence/firebase-cli-integrity.json
          pnpm add --global "firebase-tools@$FIREBASE_CLI_VERSION"
          test "$(firebase --version)" = "$FIREBASE_CLI_VERSION"

      - name: Authenticate to Google Cloud with workload identity
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup exact gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          version: ${{ env.GCLOUD_CLI_VERSION }}
          project_id: ${{ secrets.URAI_JOBS_FIREBASE_PROJECT_ID }}

      - name: Initialize protected deployment configuration
        shell: bash
        env:
          CONFIG_PROJECT: ${{ secrets.URAI_JOBS_FIREBASE_PROJECT_ID }}
          CONFIG_REGION: ${{ secrets.GCP_REGION }}
          CONFIG_BUCKET: ${{ secrets.GCS_BUCKET_NAME }}
          CONFIG_ORIGINS: ${{ secrets.API_ALLOWED_ORIGINS }}
          CONFIG_HOSTING_SITE: ${{ secrets.FIREBASE_HOSTING_SITE }}
          CONFIG_FALLBACK_SITE: ${{ secrets.FIREBASE_FALLBACK_HOSTING_SITE }}
          CONFIG_RUNTIME_SERVICE_ACCOUNT: ${{ secrets.WORKER_RUNTIME_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const values = {
            DEPLOY_PROJECT_ID: process.env.CONFIG_PROJECT,
            GCP_REGION: process.env.CONFIG_REGION || 'us-central1',
            GCS_BUCKET_NAME: process.env.CONFIG_BUCKET,
            API_ALLOWED_ORIGINS: process.env.CONFIG_ORIGINS,
            FIREBASE_HOSTING_SITE: process.env.CONFIG_HOSTING_SITE,
            FIREBASE_FALLBACK_HOSTING_SITE: process.env.CONFIG_FALLBACK_SITE || '',
            WORKER_RUNTIME_SERVICE_ACCOUNT: process.env.CONFIG_RUNTIME_SERVICE_ACCOUNT,
          };
          for (const [key, value] of Object.entries(values)) {
            if (key !== 'FIREBASE_FALLBACK_HOSTING_SITE' && !value) throw new Error(`${key} is required`);
            if (String(value).includes('\n') || String(value).includes('\r')) throw new Error(`${key} contains a newline`);
          }
          if (!/^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$/.test(process.env.GCLOUD_CLI_VERSION || '')) {
            throw new Error('GCLOUD_CLI_VERSION must be an exact protected semver');
          }
          fs.appendFileSync(process.env.GITHUB_ENV, Object.entries(values).map(([key, value]) => `${key}=${value}`).join('\n') + '\n');
          NODE

      - name: Verify required protected authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_PROJECT_ID"
          test -n "$GCS_BUCKET_NAME"
          test -n "$API_ALLOWED_ORIGINS"
          test -n "$FIREBASE_HOSTING_SITE"
          test -n "$WORKER_RUNTIME_SERVICE_ACCOUNT"
          test -n "$DEPLOY_ROLLBACK_CONFIG_FINGERPRINTS_JSON"
          test -n "$DEPLOY_TARGET_SECRET_VERSIONS_JSON"
          gcloud secrets describe "$URAI_JOBS_WORKER_TOKEN_SECRET" --project "$DEPLOY_PROJECT_ID" >/dev/null
          gcloud secrets describe "$URAI_WHEEL_GITHUB_TOKEN_SECRET" --project "$DEPLOY_PROJECT_ID" >/dev/null
          gcloud secrets describe "$URAI_JOBS_CALLBACK_SECRET_NAME" --project "$DEPLOY_PROJECT_ID" >/dev/null
          gcloud iam service-accounts describe "$WORKER_RUNTIME_SERVICE_ACCOUNT" --project "$DEPLOY_PROJECT_ID" >/dev/null
          gcloud storage buckets describe "gs://${GCS_BUCKET_NAME}" --project "$DEPLOY_PROJECT_ID" >/dev/null

      - name: Verify existing artifact bucket without creating infrastructure
        env:
          GCLOUD_PROJECT: ${{ env.DEPLOY_PROJECT_ID }}
          URAI_ENV: ${{ env.INPUT_TARGET }}
          ALLOW_CREATE_GCS_BUCKET: 'false'
        run: bash scripts/ensure-gcs-bucket.sh

      - name: Deploy canonical worker fleet with approved target secret versions
        env:
          URAI_ENV: ${{ env.INPUT_TARGET }}
          GCLOUD_PROJECT: ${{ env.DEPLOY_PROJECT_ID }}
          DEPLOY_SOURCE_SHA: ${{ env.TARGET_SHA }}
          DEPLOY_ROLLBACK_SHA: ${{ env.ROLLBACK_SHA }}
          URAI_DEPLOY_CONFIRM: ${{ env.INPUT_TARGET == 'prod' && 'DEPLOY-URAI-JOBS-PRODUCTION' || 'DEPLOY-URAI-JOBS-STAGING' }}
          ROLLBACK_CONFIG_RECEIPT_PATH: docs/release-evidence/worker-rollback-config-receipt.json
          DEPLOY_RECEIPT_PATH: docs/release-evidence/worker-deploy-receipt.json
        run: pnpm deploy:workers

      - name: Export deployed worker URLs
        env:
          FIREBASE_PROJECT_ID: ${{ env.DEPLOY_PROJECT_ID }}
          GCLOUD_PROJECT: ${{ env.DEPLOY_PROJECT_ID }}
          GOOGLE_CLOUD_PROJECT: ${{ env.DEPLOY_PROJECT_ID }}
        run: node scripts/export-worker-urls.mjs

      - name: Deploy verified prebuilt Firebase runtime
        env:
          URAI_ENV: ${{ env.INPUT_TARGET }}
          FIREBASE_PROJECT_ID: ${{ env.DEPLOY_PROJECT_ID }}
          GCLOUD_PROJECT: ${{ env.DEPLOY_PROJECT_ID }}
          GOOGLE_CLOUD_PROJECT: ${{ env.DEPLOY_PROJECT_ID }}
          DEPLOY_SOURCE_SHA: ${{ env.TARGET_SHA }}
          URAI_FIREBASE_PREBUILT_VERIFIED: '1'
          ALLOW_CREATE_HOSTING_SITE: 'false'
        run: pnpm deploy:firebase:prod -- $INPUT_TARGET

      - name: Verify workers and Firebase Hosting
        run: |
          pnpm prod:verify-workers
          pnpm domains:verify -- "https://${FIREBASE_HOSTING_SITE}.web.app"

      - name: Verify custom domains
        if: ${{ inputs.require_custom_domains }}
        run: pnpm domains:verify -- https://uraijobs.com https://www.uraijobs.com

      - name: Record paid-provider boundary
        run: echo '[BLOCKED] Canonical deployment cannot execute paid provider smoke; separate explicit approval and workflow are required.'

      - name: Stamp canonical deployment receipt
        env:
          URAI_ENV: ${{ env.INPUT_TARGET }}
          FIREBASE_PROJECT_ID: ${{ env.DEPLOY_PROJECT_ID }}
          GCLOUD_PROJECT: ${{ env.DEPLOY_PROJECT_ID }}
          GOOGLE_CLOUD_PROJECT: ${{ env.DEPLOY_PROJECT_ID }}
        run: |
          pnpm prod:stamp
          node - <<'NODE'
          const fs = require('fs');
          const path = 'docs/release-evidence/canonical-deploy-inputs.json';
          fs.mkdirSync('docs/release-evidence', { recursive: true });
          fs.writeFileSync(path, `${JSON.stringify({
            schemaVersion: 'urai-jobs-canonical-deploy-inputs-4',
            generatedAt: new Date().toISOString(),
            repository: process.env.GITHUB_REPOSITORY,
            workflowRunId: process.env.GITHUB_RUN_ID,
            targetSha: process.env.TARGET_SHA,
            rollbackSha: process.env.ROLLBACK_SHA,
            rollbackConfigFingerprints: JSON.parse(process.env.DEPLOY_ROLLBACK_CONFIG_FINGERPRINTS_JSON),
            targetSecretVersions: JSON.parse(process.env.DEPLOY_TARGET_SECRET_VERSIONS_JSON),
            environment: process.env.INPUT_TARGET,
            project: process.env.DEPLOY_PROJECT_ID,
            region: process.env.GCP_REGION,
            firebaseCliVersion: process.env.FIREBASE_CLI_VERSION,
            gcloudCliVersion: process.env.GCLOUD_CLI_VERSION,
            paidProviderSmokeAuthorized: false,
            paidProviderCalls: 0,
            infrastructureCreatedByWorkflow: false,
          }, null, 2)}\n`);
          NODE

      - name: Upload immutable deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: urai-jobs-canonical-deploy-${{ inputs.target }}-${{ inputs.expected_sha }}
          path: |
            docs/release-evidence/*.json
            docs/release-evidence/*.md
          if-no-files-found: error
          retention-days: 365
