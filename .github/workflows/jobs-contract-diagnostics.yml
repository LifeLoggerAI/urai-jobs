name: Jobs Contract Diagnostics

on:
  push:
    branches:
      - reconcile/jobs-release-contract-ci-into-75-20260714
    paths:
      - .github/workflows/jobs-contract-diagnostics.yml
      - functions/src/release/releaseSequencePlan.ts
      - scripts/release-plan-smoke.mjs
      - scripts/release-sequence-verify.mjs
      - docs/RELEASE_VERSION_CONTRACT.md

permissions:
  contents: read

concurrency:
  group: jobs-contract-diagnostics-${{ github.sha }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
        with:
          version: 8.15.9

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile

      - name: Run contract commands independently
        id: contracts
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/jobs-contract-diagnostics"
          commands=(
            "node scripts/release-sequence-verify.mjs"
            "node scripts/release-plan-smoke.mjs"
            "node scripts/urai-jobs-verify.mjs"
            "node scripts/queue-recovery-contract.mjs"
            "node scripts/activation-readiness-verify.mjs"
            "node scripts/check-secure-worker-deploy.mjs"
            "node scripts/check-worker-build-provenance.mjs"
            "node scripts/check-firebase-runtime-identity.mjs"
            "node scripts/check-rollback-provenance.mjs"
            "node scripts/check-required-ci-exact-head.mjs"
          )
          failed=0
          index=0
          for command in "${commands[@]}"; do
            index=$((index + 1))
            log="$RUNNER_TEMP/jobs-contract-diagnostics/$(printf '%02d' "$index").log"
            {
              echo "COMMAND: $command"
              echo "STARTED: $(date -u +%FT%TZ)"
              set +e
              bash -lc "$command"
              status=$?
              set -e
              echo "EXIT: $status"
              echo "FINISHED: $(date -u +%FT%TZ)"
            } >"$log" 2>&1
            if ! grep -q '^EXIT: 0$' "$log"; then failed=1; fi
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload exact diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jobs-contract-diagnostics-${{ env.TARGET_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/jobs-contract-diagnostics
          retention-days: 30
          if-no-files-found: error

      - name: Fail after retaining diagnostics
        if: steps.contracts.outputs.failed == '1'
        run: exit 1
