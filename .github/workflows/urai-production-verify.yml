name: URAI Production Verify

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: urai-jobs-production-verify-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact reviewed head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checkout_home="$RUNNER_TEMP/urai-jobs-checkout-home"
          rm -rf -- "$checkout_home"
          mkdir -m 700 -- "$checkout_home"
          export HOME="$checkout_home"
          gh auth setup-git >/dev/null
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          git fetch --no-tags --prune --no-recurse-submodules --depth=1 origin "$TARGET_SHA"
          git checkout --detach --force "$TARGET_SHA"
          git remote set-url origin "https://github.com/$GITHUB_REPOSITORY"
          rm -rf -- "$checkout_home"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Prove exact clean head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
        with:
          version: 8.15.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile

      - name: Prove install preserved exact source
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"

      - name: Verify
        run: node scripts/urai-production-verify.mjs

      - name: Capture source mutation diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/source-mutation
          git status --short --untracked-files=all > artifacts/source-mutation/status.txt
          git diff --binary > artifacts/source-mutation/working-tree.patch
          git diff --cached --binary > artifacts/source-mutation/index.patch

      - name: Upload source mutation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: urai-jobs-source-mutation-${{ env.TARGET_SHA }}-${{ github.run_id }}
          path: artifacts/source-mutation
          if-no-files-found: error
          retention-days: 365

      - name: Reject tracked mutation and remove generated output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          rm -rf artifacts
          git clean -fdx
          test -z "$(git status --porcelain --untracked-files=all)"
