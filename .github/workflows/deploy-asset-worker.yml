name: Deploy Asset Worker

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to authorize this production-affecting workflow
        required: true
        type: string
      region:
        description: Cloud Run region
        required: true
        default: us-central1
        type: string
      service_name:
        description: Cloud Run service name
        required: true
        default: urai-asset-worker
        type: string

concurrency:
  group: deploy-urai-asset-worker
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  verify-and-deploy:
    if: inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      RUNTIME_SERVICE_ACCOUNT: ${{ secrets.ASSET_WORKER_RUNTIME_SERVICE_ACCOUNT }}
      REGION: ${{ inputs.region }}
      SERVICE_NAME: ${{ inputs.service_name }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Validate worker source and authorization boundary
        working-directory: workers/asset-worker
        run: |
          npm ci
          npm run typecheck
          grep -q "URAI_JOBS_WORKER_TOKEN" index.js
          grep -q "Invalid worker authorization" index.js
          grep -q "URAI_JOBS_CALLBACK_SECRET" index.js

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Production secret and authority preflight
        shell: bash
        run: |
          test -n "$GCP_PROJECT_ID"
          test -n "$RUNTIME_SERVICE_ACCOUNT"
          gcloud secrets describe urai-wheel-github-token --project "$GCP_PROJECT_ID" >/dev/null
          gcloud secrets describe urai-jobs-worker-token --project "$GCP_PROJECT_ID" >/dev/null
          gcloud secrets describe urai-jobs-callback-secret --project "$GCP_PROJECT_ID" >/dev/null

      - name: Deploy Asset Worker
        shell: bash
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --source workers/asset-worker \
            --project "$GCP_PROJECT_ID" \
            --region "$REGION" \
            --platform managed \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --concurrency 20 \
            --timeout 300 \
            --set-env-vars ASSET_FACTORY_REPO=LifeLoggerAI/asset-factory,URAI_ENV=production \
            --set-secrets URAI_WHEEL_GITHUB_TOKEN=urai-wheel-github-token:latest,URAI_JOBS_WORKER_TOKEN=urai-jobs-worker-token:latest,URAI_JOBS_CALLBACK_SECRET=urai-jobs-callback-secret:latest

      - name: Verify deployed worker
        shell: bash
        run: |
          service_url="$(gcloud run services describe "$SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          test -n "$service_url"
          echo "ASSET_WORKER_URL=$service_url" >> "$GITHUB_ENV"
          curl --fail-with-body --retry 6 --retry-delay 5 "$service_url/healthz"

      - name: Deployment summary
        run: |
          echo "### URAI Asset Worker" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service: $SERVICE_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Region: $REGION" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $ASSET_WORKER_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public ingress is required for the external callback; dispatch and callback routes must remain separately bearer-protected." >> "$GITHUB_STEP_SUMMARY"
