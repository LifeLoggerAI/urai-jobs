name: URAI Jobs System Audit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: urai-jobs-system-audit-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  audit:
    name: System audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact reviewed head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checkout_home="$RUNNER_TEMP/urai-jobs-checkout-home"
          rm -rf -- "$checkout_home"
          mkdir -m 700 -- "$checkout_home"
          export HOME="$checkout_home"
          gh auth setup-git >/dev/null
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          git fetch --no-tags --prune --no-recurse-submodules --depth=1 origin "$TARGET_SHA"
          git checkout --detach --force "$TARGET_SHA"
          git remote set-url origin "https://github.com/$GITHUB_REPOSITORY"
          rm -rf -- "$checkout_home"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Prove exact clean head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Enable pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
        with:
          version: 8.15.9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile

      - name: Prove install preserved exact source
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"

      - name: Run system audit
        run: pnpm audit:systems

      - name: Prove final clean tree
        if: always()
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"
