name: URAI Jobs CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: urai-jobs-gates-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  FIREBASE_TOOLS_VERSION: 15.24.0

jobs:
  gates:
    name: Build, typecheck, smoke, emulator E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact reviewed head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checkout_home="$RUNNER_TEMP/urai-jobs-checkout-home"
          rm -rf -- "$checkout_home"
          mkdir -m 700 -- "$checkout_home"
          export HOME="$checkout_home"
          gh auth setup-git >/dev/null
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          git fetch --no-tags --prune --no-recurse-submodules --depth=1 origin "$TARGET_SHA"
          git checkout --detach --force "$TARGET_SHA"
          git remote set-url origin "https://github.com/$GITHUB_REPOSITORY"
          rm -rf -- "$checkout_home"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Prove exact clean head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
        with:
          version: 8.15.9

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verify functions npm lockfile
        run: npm --prefix functions ci --ignore-scripts

      - name: Install exact workspace dependency graph
        run: pnpm install --frozen-lockfile

      - name: Prove install preserved exact source
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"

      - name: Verify Firebase SDK versions
        run: pnpm --filter urai-jobs-functions list firebase-functions firebase-admin --depth 0

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify URAI Jobs contracts
        run: pnpm urai-jobs:verify

      - name: Smoke test URAI Jobs logic
        run: pnpm urai-jobs:smoke

      - name: Emulator E2E
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP}/urai-jobs-emulator-e2e.log"
          if npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" emulators:exec --only firestore,auth,functions "node scripts/urai-jobs-e2e.mjs" >"$log_file" 2>&1; then
            grep -E '\[STEP|\[PASS|URAI_JOBS_E2E_VALIDATION' "$log_file" || true
            exit 0
          fi
          echo '=== URAI Jobs emulator failure summary ==='
          grep -E '\[FAIL\]|Error|ERROR|error|FAILED|Exception|exception|not found|permission-denied|unauthenticated|ECONN|timeout' "$log_file" | tail -n 120 || true
          echo '=== Final emulator log lines ==='
          tail -n 80 "$log_file"
          exit 1

      - name: Deploy precheck
        run: pnpm urai-jobs:deploy-precheck

      - name: Reject tracked mutation and remove generated output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          git status --short --untracked-files=all
          git clean -fdx
          test -z "$(git status --porcelain --untracked-files=all)"
