name: URAI Jobs Runtime CI

on:
  pull_request:
  push:
    branches:
      - main
      - hardening/urai-jobs-runtime

permissions:
  contents: read

concurrency:
  group: urai-jobs-runtime-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  FIREBASE_TOOLS_VERSION: 15.24.0
  # Prevent firebase-functions params from opening an interactive prompt in CI.
  # This is an emulator-only identity; protected deploys supply the real account.
  URAI_JOBS_FUNCTIONS_RUNTIME_SERVICE_ACCOUNT: urai-jobs-emulator@demo-urai-jobs.iam.gserviceaccount.com
  # Emulator-only token for the consent.revoked.v1 HTTP contract.
  URAI_JOBS_PRIVACY_EVENT_TOKEN: e2e-privacy-event-token

jobs:
  validate:
    name: Validate runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact reviewed head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checkout_home="$RUNNER_TEMP/urai-jobs-checkout-home"
          rm -rf -- "$checkout_home"
          mkdir -m 700 -- "$checkout_home"
          export HOME="$checkout_home"
          gh auth setup-git >/dev/null
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          git fetch --no-tags --prune --no-recurse-submodules --depth=1 origin "$TARGET_SHA"
          git checkout --detach --force "$TARGET_SHA"
          git remote set-url origin "https://github.com/$GITHUB_REPOSITORY"
          rm -rf -- "$checkout_home"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Prove exact clean head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Enable pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 8.15.9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile

      - name: Prove install preserved exact source
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"

      - name: Verify actual Life Movies media timing
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          node scripts/life-movies-media-timing-smoke.mjs
          node scripts/life-movies-source-interval-smoke.mjs --media
          node scripts/life-movies-delayed-audio-smoke.mjs
          node scripts/life-movies-cancellation-smoke.mjs
          node scripts/life-movies-render-budget-smoke.mjs
          URAI_SOURCE_SHA="$TARGET_SHA" node scripts/life-movies-assembly-media-smoke.mjs --evidence-dir "$RUNNER_TEMP/life-movies-assembly-proof"

      - name: Retain exact-head synthetic assembly evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: urai-life-movie-assembly-source-${{ env.TARGET_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/life-movies-assembly-proof/
          if-no-files-found: error
          retention-days: 90

      - name: Verify activation readiness guardrails
        run: pnpm activation:verify

      - name: Verify repository invariants
        run: pnpm urai-jobs:verify

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Verify exact narrator container source without provider execution
        shell: bash
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/narrator-exact-context-$TARGET_SHA"
          node scripts/prepare-narrator-build-context.mjs --source-sha "$TARGET_SHA" --output "$context"
          docker build --file "$context/Dockerfile" --tag "urai-jobs-narrator-verify:$TARGET_SHA" "$context"
          docker run --rm --network none --env URAI_SOURCE_SHA="$TARGET_SHA" --entrypoint node \
            "urai-jobs-narrator-verify:$TARGET_SHA" \
            -e 'const {narratorExecutorSourceSha}=require("./dist/protected-spend.js");if(narratorExecutorSourceSha()!==process.env.URAI_SOURCE_SHA)throw new Error("Narrator runtime source mismatch");'

      - name: Verify current pinned Model Forge compatibility without provider execution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_FORGE_FACTORY_SHA: e9402bc64aadbd6087f0e84250eb56ebbab85b37
        run: |
          set -euo pipefail
          actual_factory_sha="$(gh api repos/LifeLoggerAI/asset-factory/pulls/421 --jq .head.sha)"
          if [ "$actual_factory_sha" != "$MODEL_FORGE_FACTORY_SHA" ]; then
            echo "Factory owner moved: expected $MODEL_FORGE_FACTORY_SHA, observed $actual_factory_sha"
            exit 1
          fi
          factory_dir="$(dirname "$GITHUB_WORKSPACE")/world-factory-assets"
          test ! -e "$factory_dir"
          mkdir "$factory_dir"
          git -C "$factory_dir" init
          git -C "$factory_dir" remote add origin https://github.com/LifeLoggerAI/asset-factory
          git -C "$factory_dir" sparse-checkout set --no-cone /model_forge/validate-glb.mjs /model_forge/triangle-budget.mjs /model_forge/glb-container.mjs
          git -C "$factory_dir" fetch --no-tags --no-recurse-submodules --depth=1 origin "$MODEL_FORGE_FACTORY_SHA"
          git -C "$factory_dir" checkout --detach "$MODEL_FORGE_FACTORY_SHA"
          test "$(git -C "$factory_dir" rev-parse HEAD)" = "$MODEL_FORGE_FACTORY_SHA"
          test -z "$(git -C "$factory_dir" status --porcelain --untracked-files=all)"
          for file in validate-glb.mjs triangle-budget.mjs glb-container.mjs; do
            test -f "$factory_dir/model_forge/$file"
          done
          node --test --test-reporter=tap workers/generic-world-factory/test/factory.test.mjs | tee "$RUNNER_TEMP/jobs-model-forge-compatibility-$TARGET_SHA.tap"
          proof="$RUNNER_TEMP/jobs-model-forge-compatibility-$TARGET_SHA.tap"
          grep -qx '# tests 19' "$proof"
          grep -qx '# pass 19' "$proof"
          grep -qx '# fail 0' "$proof"
          grep -qx '# skipped 0' "$proof"
          test -z "$(git -C "$factory_dir" status --porcelain --untracked-files=all)"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Retain exact-head Model Forge compatibility log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: urai-jobs-model-forge-compatibility-${{ env.TARGET_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/jobs-model-forge-compatibility-${{ env.TARGET_SHA }}.tap
          if-no-files-found: error
          retention-days: 90

      - name: Unit tests
        run: pnpm test

      - name: Smoke checks
        run: pnpm urai-jobs:smoke

  emulator-e2e:
    name: Callable emulator E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate

    steps:
      - name: Checkout exact reviewed head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checkout_home="$RUNNER_TEMP/urai-jobs-checkout-home"
          rm -rf -- "$checkout_home"
          mkdir -m 700 -- "$checkout_home"
          export HOME="$checkout_home"
          gh auth setup-git >/dev/null
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          git fetch --no-tags --prune --no-recurse-submodules --depth=1 origin "$TARGET_SHA"
          git checkout --detach --force "$TARGET_SHA"
          git remote set-url origin "https://github.com/$GITHUB_REPOSITORY"
          rm -rf -- "$checkout_home"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Prove exact clean head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Enable pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 8.15.9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup Java 21 for Firebase emulators
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.1
        with:
          distribution: temurin
          java-version: 21

      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile

      - name: Prove install preserved exact source
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"

      - name: Build functions and shared types
        run: pnpm --filter @urai-jobs/shared-types build && pnpm --filter urai-jobs-functions build

      - name: Capture callable E2E result
        id: emulator
        shell: bash
        run: |
          set +e
          printf 'URAI_JOBS_FUNCTIONS_RUNTIME_SERVICE_ACCOUNT=%s\nURAI_JOBS_PRIVACY_EVENT_TOKEN=%s\n' "$URAI_JOBS_FUNCTIONS_RUNTIME_SERVICE_ACCOUNT" "$URAI_JOBS_PRIVACY_EVENT_TOKEN" > functions/.env.demo-urai-jobs
          trap 'rm -f functions/.env.demo-urai-jobs' EXIT
          timeout --kill-after=30s 8m npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" --project demo-urai-jobs emulators:exec --only firestore,auth,functions "node scripts/life-movies-derivative-revocation-smoke.mjs --emulator && node scripts/urai-jobs-e2e.mjs" > urai-jobs-emulator-e2e.log 2>&1
          status=$?
          rm -f functions/.env.demo-urai-jobs
          trap - EXIT
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload emulator E2E log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: urai-jobs-emulator-e2e-${{ env.TARGET_SHA }}-${{ github.run_id }}
          path: urai-jobs-emulator-e2e.log
          if-no-files-found: error
          retention-days: 90

      - name: Enforce callable E2E result
        shell: bash
        run: test "${{ steps.emulator.outputs.status }}" = "0"
