name: URAI Jobs Runtime CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - hardening/urai-jobs-runtime

permissions:
  contents: read

env:
  TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  FIREBASE_TOOLS_VERSION: 15.23.0

jobs:
  validate:
    name: Validate runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact clean head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile

      - name: Prove install preserved exact source
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"

      - name: Verify activation readiness guardrails
        run: pnpm activation:verify

      - name: Verify repository invariants
        run: pnpm urai-jobs:verify

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Smoke checks
        run: pnpm urai-jobs:smoke

  emulator-e2e:
    name: Callable emulator E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate

    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact clean head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java 21 for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile

      - name: Prove install preserved exact source
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"

      - name: Build functions and shared types
        run: pnpm --filter @urai-jobs/shared-types build && pnpm --filter urai-jobs-functions build

      - name: Capture callable E2E result
        id: emulator
        shell: bash
        run: |
          set +e
          npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" emulators:exec --only firestore,auth,functions "node scripts/urai-jobs-e2e.mjs" > urai-jobs-emulator-e2e.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload emulator E2E log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urai-jobs-emulator-e2e-${{ env.TARGET_SHA }}
          path: urai-jobs-emulator-e2e.log
          if-no-files-found: error
          retention-days: 365

      - name: Enforce callable E2E result
        shell: bash
        run: test "${{ steps.emulator.outputs.status }}" = "0"
