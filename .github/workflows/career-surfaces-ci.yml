name: Career Surfaces CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "web/src/lib/career*.ts"
      - "web/src/pages/Career*.tsx"
      - "web/src/App.tsx"
      - "web/src/pages/LandingPage.tsx"
      - "workers/career-worker/**"
      - "scripts/career-surfaces-verify.mjs"
      - "scripts/career-runtime-smoke.mjs"
      - "scripts/activation-readiness-verify.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/career-surfaces-ci.yml"
  push:
    branches:
      - main
    paths:
      - "web/src/lib/career*.ts"
      - "web/src/pages/Career*.tsx"
      - "web/src/App.tsx"
      - "web/src/pages/LandingPage.tsx"
      - "workers/career-worker/**"
      - "scripts/career-surfaces-verify.mjs"
      - "scripts/career-runtime-smoke.mjs"
      - "scripts/activation-readiness-verify.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/career-surfaces-ci.yml"

permissions:
  contents: read

concurrency:
  group: urai-jobs-career-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  career-surfaces:
    name: Verify career surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact clean head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile

      - name: Prove install preserved exact source
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"

      - name: Verify career surfaces
        run: pnpm career:verify

      - name: Verify career runtime smoke
        run: pnpm career:smoke

      - name: Verify activation readiness
        run: pnpm activation:verify

      - name: Typecheck web
        run: pnpm --dir web typecheck

      - name: Build web
        run: pnpm --dir web build

      - name: Typecheck career worker
        run: pnpm career-worker:typecheck

      - name: Build career worker
        run: pnpm career-worker:build
