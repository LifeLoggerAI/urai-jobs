name: Defined Gitlink Guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          show-progress: false
      - name: Regression-test complete gitlink paths
        run: bash scripts/test-verify-defined-gitlinks.sh

      - name: Reject undefined or branch-following gitlinks
        run: bash scripts/verify-defined-gitlinks.sh HEAD
