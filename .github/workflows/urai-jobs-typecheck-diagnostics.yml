name: URAI Jobs Typecheck Diagnostics

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'functions/**'
      - 'web/**'
      - 'workers/**'
      - 'packages/**'
      - 'types/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/urai-jobs-typecheck-diagnostics.yml'

permissions:
  contents: read

concurrency:
  group: urai-jobs-typecheck-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  diagnostics:
    name: Capture checkout and typecheck output
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Capture manual exact checkout diagnostics
        id: checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          set -o pipefail
          checkout_log="$RUNNER_TEMP/urai-jobs-checkout-diagnostics.log"
          rm -f -- "$checkout_log"
          {
            set -euo pipefail
            find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
            gh auth setup-git >/dev/null
            git init .
            git remote add origin "https://github.com/$GITHUB_REPOSITORY"
            git fetch --no-tags --prune --no-recurse-submodules --depth=1 origin "$TARGET_SHA"
            git checkout --detach --force "$TARGET_SHA"
            test "$(git rev-parse HEAD)" = "$TARGET_SHA"
            git remote set-url origin "https://github.com/$GITHUB_REPOSITORY"
            git config --local --unset-all http.https://github.com/.extraheader || true
          } 2>&1 | tee "$checkout_log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload checkout diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: urai-jobs-checkout-diagnostics-${{ env.TARGET_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/urai-jobs-checkout-diagnostics.log
          if-no-files-found: error
          retention-days: 365

      - name: Enforce exact checkout result
        shell: bash
        run: test "${{ steps.checkout.outputs.status }}" = "0"

      - name: Prove exact clean head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Enable pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
        with:
          version: 8.15.9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile

      - name: Prove install preserved exact source
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"

      - name: Capture typecheck log
        shell: bash
        run: |
          set +e
          set -o pipefail
          mkdir -p artifacts/ci-diagnostics
          pnpm typecheck 2>&1 | tee artifacts/ci-diagnostics/typecheck-diagnostics.log
          status=${PIPESTATUS[0]}
          echo "$status" > artifacts/ci-diagnostics/typecheck-exit-code.txt
          exit "$status"

      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: urai-jobs-typecheck-diagnostics-${{ env.TARGET_SHA }}-${{ github.run_id }}
          path: |
            artifacts/ci-diagnostics/typecheck-diagnostics.log
            artifacts/ci-diagnostics/typecheck-exit-code.txt
          if-no-files-found: ignore
          retention-days: 365

      - name: Restore and prove clean tree
        if: always()
        shell: bash
        run: |
          rm -rf artifacts
          if git rev-parse --git-dir >/dev/null 2>&1; then
            test "$(git rev-parse HEAD)" = "$TARGET_SHA"
            test -z "$(git status --porcelain --untracked-files=all)"
          fi
