name: URAI Jobs Typecheck Diagnostics

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'functions/**'
      - 'web/**'
      - 'workers/**'
      - 'packages/**'
      - 'types/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/urai-jobs-typecheck-diagnostics.yml'

permissions:
  contents: read

env:
  TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  diagnostics:
    name: Capture typecheck output
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact clean head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile

      - name: Prove install preserved exact source
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"

      - name: Capture typecheck log
        shell: bash
        run: |
          set +e
          pnpm typecheck > typecheck-diagnostics.log 2>&1
          status=$?
          tail -n 120 typecheck-diagnostics.log
          echo "$status" > typecheck-diagnostics.exit
          exit "$status"

      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urai-jobs-typecheck-diagnostics-${{ env.TARGET_SHA }}
          path: |
            typecheck-diagnostics.log
            typecheck-diagnostics.exit
          if-no-files-found: error
          retention-days: 365
