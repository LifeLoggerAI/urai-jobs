name: URAI Jobs Typecheck Diagnostics

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'functions/**'
      - 'web/**'
      - 'workers/**'
      - 'packages/**'
      - 'types/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/urai-jobs-typecheck-diagnostics.yml'

permissions:
  contents: read

concurrency:
  group: urai-jobs-typecheck-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  diagnostics:
    name: Capture typecheck output
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Enable pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
        with:
          version: 8.15.9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile

      - name: Prove install preserved exact source
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"

      - name: Capture typecheck log
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/ci-diagnostics
          pnpm typecheck 2>&1 | tee artifacts/ci-diagnostics/typecheck-diagnostics.log

      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: urai-jobs-typecheck-diagnostics-${{ env.TARGET_SHA }}-${{ github.run_id }}
          path: artifacts/ci-diagnostics/typecheck-diagnostics.log
          if-no-files-found: ignore
          retention-days: 365

      - name: Restore and prove clean tree
        if: always()
        shell: bash
        run: |
          rm -rf artifacts
          test -z "$(git status --porcelain --untracked-files=all)"
