name: One-time Cloud Run secret-key repair

on:
  push:
    branches:
      - secure-worker-deploy-20260706
    paths:
      - '.github/workflows/one-time-cloud-run-secret-key-fix.yml'

permissions:
  contents: write

concurrency:
  group: one-time-cloud-run-secret-key-fix
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact Jobs branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: secure-worker-deploy-20260706
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Apply exact Cloud Run secret-version repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'scripts/verify-rollback-revision.mjs',
              "    if (secretRef?.version != null) secretVersions[entry.name] = String(secretRef.version);",
              "    if (secretRef?.key != null) secretVersions[entry.name] = String(secretRef.key);",
          )
          replace_once(
              'scripts/deploy-workers.sh',
              "  if (entry?.name && ref?.version) observedSecrets[entry.name] = String(ref.version);",
              "  if (entry?.name && ref?.key) observedSecrets[entry.name] = String(ref.key);",
          )

          contract = Path('scripts/check-secure-worker-deploy.mjs')
          text = contract.read_text()
          anchor = "const deployWorkersSource = read('scripts/deploy-workers.sh');"
          assertions = """requireText('scripts/verify-rollback-revision.mjs', 'secretRef?.key != null', 'rollback verifier must read Cloud Run secret versions from secretKeyRef.key');
          rejectText('scripts/verify-rollback-revision.mjs', 'secretRef?.version', 'rollback verifier must not read the nonexistent secretKeyRef.version field');
          requireText('scripts/deploy-workers.sh', 'if (entry?.name && ref?.key)', 'deployed revision verifier must read Cloud Run secret versions from secretKeyRef.key');
          rejectText('scripts/deploy-workers.sh', 'ref?.version', 'deployed revision verifier must not read the nonexistent secretKeyRef.version field');

          """
          if assertions not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('secure deploy contract insertion anchor mismatch')
              text = text.replace(anchor, assertions + anchor, 1)
          contract.write_text(text)
          PY

      - name: Verify focused Jobs repairs
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/verify-rollback-revision.mjs
          bash -n scripts/deploy-workers.sh
          node --check scripts/check-secure-worker-deploy.mjs
          node scripts/check-secure-worker-deploy.mjs
          git diff --check

      - name: Commit permanent Jobs files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LifeLoggerAI release automation'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/verify-rollback-revision.mjs scripts/deploy-workers.sh scripts/check-secure-worker-deploy.mjs
          git diff --cached --check
          git commit -m 'Read Cloud Run secret versions from key'
          git push origin HEAD:secure-worker-deploy-20260706
