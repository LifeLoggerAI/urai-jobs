name: UrAiProd Gitlink Removal Guard

on:
  pull_request:
    branches:
      - maintenance/pin-firebase-cli-15-24-0-20260801
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-removal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate with read-only token
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: false

      - name: Scrub checkout authentication
        shell: bash
        run: |
          set -euo pipefail
          git config --local --unset-all http.https://github.com/.extraheader || true
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"

      - name: Verify exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Prove obsolete gitlink is absent
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-tree HEAD -- UrAiProd)"
          test ! -e .gitmodules

      - name: Prove no live consumer remains
        shell: bash
        run: |
          set -euo pipefail
          matches="$(git grep -n -I -E '(^|[^[:alnum:]_])UrAiProd([^[:alnum:]_]|$)' -- ':!docs/legacy-uraiprod-gitlink-removal.md' ':!evidence/uraiprod-removal/**' ':!.github/workflows/uraiprod-gitlink-removal-guard.yml' || true)"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            exit 1
          fi

      - name: Record nondeployment boundary
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'productionTargeted=false' 'dnsMutation=false' 'billingMutation=false' 'providerMutation=false'
