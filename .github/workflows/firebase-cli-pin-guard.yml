name: Firebase CLI Pin Guard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urai-jobs-firebase-cli-pin-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Verify immutable Firebase CLI authority
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout exact reviewed head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checkout_home="$RUNNER_TEMP/urai-jobs-checkout-home"
          rm -rf -- "$checkout_home"
          mkdir -m 700 -- "$checkout_home"
          export HOME="$checkout_home"
          gh auth setup-git >/dev/null
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          git fetch --no-tags --prune --no-recurse-submodules --depth=1 origin "$TARGET_SHA"
          git checkout --detach --force "$TARGET_SHA"
          git remote set-url origin "https://github.com/$GITHUB_REPOSITORY"
          rm -rf -- "$checkout_home"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Verify exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Enforce reviewed Firebase CLI version
        shell: bash
        run: |
          set -euo pipefail
          expected='15.24.0'
          files=(
            .github/workflows/urai-jobs-ci.yml
            .github/workflows/urai-jobs-runtime-ci.yml
          )

          for file in "${files[@]}"; do
            test -f "$file"
            if grep -nE 'firebase-tools@(latest|next|canary|preview|rc)' "$file"; then
              echo "Mutable or prerelease Firebase CLI authority found in $file" >&2
              exit 1
            fi
            grep -qE "FIREBASE_TOOLS_VERSION:[[:space:]]*${expected}|firebase-tools@${expected}" "$file"
          done

          test "$(grep -RhE "FIREBASE_TOOLS_VERSION:[[:space:]]*${expected}|firebase-tools@${expected}" .github/workflows | wc -l | tr -d ' ')" -ge 2
          grep -q 'Career V1-V5 surfaces and worker are scaffold-only' .github/workflows/career-production-release.yml
          echo "Firebase CLI authority is pinned to ${expected} across Jobs CI and Runtime CI; the deprecated Career release remains fail-closed."

      - name: Preserve non-deployment boundary
        run: echo 'This guard performs no deployment, provider call, credential validation, IAM action, billing action, or production-data mutation.'
